# Mars map configuration: everything the product owner may need to change, in one place.
#
# Loaded at startup by the API and by `python -m app.graph`. Point to another file with the MARS_CONFIG
# environment variable (API) or `--config PATH` (graph builder). Changing a profile parameter changes the
# graph's formula version, so rebuild the graph afterwards: `cd backend && python -m app.graph`.
#
# Every number below is a PLACEHOLDER (a reasonable engineering guess, not a requirement or a real suit or
# rover specification) until its section is marked confirmed in `confirmation` at the bottom.

grid:
  # The graph and the map overlay share one grid: the 200 m DEM divided by this factor.
  # 1 = native 200 m (1.29 M nodes, 10.3 M edges, ~40 s to build, 490 MB file). 2 = ~400 m (~320k nodes).
  coarsen: 1

routing:
  # Share of each budget kept in reserve: a trip that uses more than capacity * (1 - reserve_margin) gets a warning.
  reserve_margin: 0.2
  # A clicked point farther than this from the nearest node with elevation data is rejected (HTTP 422).
  max_snap_distance_m: 1000

poi:
  # Points of interest within this distance of a point are reported when sampling a location.
  sample_radius_km: 2.0

# Budgets per profile, in the units below. These are the amounts a vehicle or suit CARRIES for one trip.
# A route whose total use of a resource exceeds capacity * (1 - reserve_margin) gets a warning in the response.
# Budgets are only checked after the route is found; they do not steer the search. Leave empty for no warnings.
#   time_s     trip duration limit (s), e.g. the maximum EVA length          o2_g    oxygen carried (g)
#   co2_g      CO2 the scrubber can absorb (g)                              water_g cooling water carried (g)
#   energy_wh  battery energy (Wh)
# Example, to be replaced by real values:
#   capacities:
#     astronaut: {time_s: 28800, o2_g: 2000, co2_g: 2400, water_g: 4000, energy_wh: 1500}
#     car:       {time_s: 36000, energy_wh: 20000}
capacities: {}

# Slope classes of the map overlay and the `point` endpoint (display only). The routing limits are the
# `hard_limit_deg` of each profile below; the loader checks they agree: the steepest walkable class must end at
# the astronaut limit and the steepest drivable class at the car limit.
slope_classes:
  - {id: easy_walk,     label: Easy walk,           min_deg: 0,  max_deg: 5,  color: "#1a9850", walkable: true,  vehicle: true}
  - {id: walkable,      label: Walkable,            min_deg: 5,  max_deg: 15, color: "#91cf60", walkable: true,  vehicle: true}
  - {id: vehicle_only,  label: Vehicle only,        min_deg: 15, max_deg: 25, color: "#fee08b", walkable: false, vehicle: true}
  - {id: vehicle_limit, label: Hard / vehicle limit, min_deg: 25, max_deg: 35, color: "#fc8d59", walkable: false, vehicle: true}
  - {id: impassable,    label: Impassable,          min_deg: 35, max_deg: 90, color: "#d73027", walkable: false, vehicle: false}

# Cost and resource model of each profile (references/edge-cost-model.md). Names match the model parameters.
# cost = length * (1 + (|slope| / hard_limit)^p) * [alpha * time_ratio + beta * energy_ratio]; slopes beyond
# hard_limit are impassable. Body mass is NOT here for the route: the astronaut's body_mass_kg is only the
# reference mass of the stored graph, each user's own mass (from their account) is used for the estimates.
profiles:
  astronaut:
    hard_limit_deg: 15.0
    alpha: 0.5               # weight of travel time in the cost
    beta: 0.5                # weight of energy in the cost
    p: 2.0                   # how fast the cost rises towards the slope limit
    body_mass_kg: 80.0       # reference mass of the stored graph
    suit_mass_kg: 50.0
    gear_mass_kg: 20.0
    efficiency_factor: 1.0
    suit_mobility_penalty: 1.3   # extra effort of moving in a pressurised suit
    speed_factor: 0.6            # share of the Tobler walking speed reached in a suit
    gravity_factor: 1.0          # calibration for 3.71 m/s2
    p_suit_w: 150.0              # suit power draw (W)
    o2_leak_g_per_s: 0.001
    env_heat_w: 100.0            # heat load from the environment (W)
    h_cool_j_per_g: 2400.0       # heat removed per gram of cooling water (J/g)
    rq: 0.85                     # respiratory quotient
    o2_kj_per_l: 20.1            # energy per litre of oxygen consumed (kJ/L)
  car:
    hard_limit_deg: 35.0
    alpha: 0.5
    beta: 0.5
    p: 2.0
    mass_kg: 1000.0
    c_rr: 0.25                   # rolling resistance on regolith
    eta_drive: 0.6               # drivetrain efficiency
    v_max_ms: 4.0
    v_min_ms: 0.5
    p_speed: 2.0                 # how fast speed drops towards the slope limit
    p_aux_w: 500.0               # auxiliary power (W)
    crew_n: 2
    crew_o2_g_per_s: 0.0097      # per person, seated in a pressurised cabin
    crew_co2_g_per_s: 0.0116
    crew_water_g_per_s: 0.035

# Which sections the product owner has signed off. The API logs the unconfirmed ones at startup.
# To confirm a section: check its numbers, set status to confirmed, and name the source (a document, a
# person and a date). A confirmed section without a source is rejected.
confirmation:
  slope_classes:      {status: placeholder, source: ""}
  profiles.astronaut: {status: placeholder, source: ""}
  profiles.car:       {status: placeholder, source: ""}
  capacities:         {status: placeholder, source: ""}
